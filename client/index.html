<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>need-blood</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <h1>need blood</h1>
    </nav>

    <section class="hero">
        <h2>Emergency Blood Donor Matchmaking Perform</h2>

        <p>
            Connecting blood donors with patients instantly during emergencies.
        </p>

        <button>Request Blood</button>
    </section>

    <section class="donor-form">

        <h2>Become a Blood Donor</h2>

        <form>

            <input type="text" placeholder="Full Name">

            <input type="tel" placeholder="Phone Number">

            <select>
      <option>Select Blood Group</option>
      <option>A+</option>
      <option>A-</option>
      <option>B+</option>
      <option>B-</option>
      <option>O+</option>
      <option>O-</option>
      <option>AB+</option>
      <option>AB-</option>
    </select>

            <input type="text" placeholder="Location">

            <button type="submit">Register Donor</button>

        </form>

    </section>

    <section class="request-section">

        <h2>Emergency Blood Request</h2>

        <form>

            <input type="text" placeholder="Patient Name">

            <select>
      <option>Required Blood Group</option>
      <option>A+</option>
      <option>A-</option>
      <option>B+</option>
      <option>B-</option>
      <option>O+</option>
      <option>O-</option>
      <option>AB+</option>
      <option>AB-</option>
    </select>

            <input type="text" placeholder="Hospital Name">

            <input type="text" placeholder="Location">

            <button type="submit">Send Emergency Request</button>

        </form>

    </section>

    <scripy src="script.js"></scripy>

</body>

</html>
